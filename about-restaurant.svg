<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8ddd0"/>
      <stop offset="100%" stop-color="#c8b898"/>
    </linearGradient>
  </defs>
  <!-- Background / walls -->
  <rect width="560" height="420" fill="url(#wallGrad)"/>
  <!-- Floor -->
  <rect x="0" y="300" width="560" height="120" fill="#8b6830"/>
