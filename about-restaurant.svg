  <circle cx="200" cy="252" r="14" fill="#f5f0ea" stroke="#ddd" stroke-width="1"/>
  <line x1="110" y1="244" x2="110" y2="262" stroke="#bbb" stroke-width="2"/>
  <line x1="120" y1="244" x2="120" y2="262" stroke="#bbb" stroke-width="1.5"/>
