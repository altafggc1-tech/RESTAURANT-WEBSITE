  <!-- Floor tiles -->
  <rect x="0" y="310" width="70" height="55" fill="none" stroke="#7a5820" stroke-width="1" opacity=".4"/>
  <rect x="70" y="310" width="70" height="55" fill="none" stroke="#7a5820" stroke-width="1" opacity=".4"/>
  <rect x="140" y="310" width="70" height="55" fill="none" stroke="#7a5820" stroke-width="1" opacity=".4"/>
  <rect x="210" y="310" width="70" height="55" fill="none" stroke="#7a5820" stroke-width="1" opacity=".4"/>
  <rect x="280" y="310" width="70" height="55" fill="none" stroke="#7a5820" stroke-width="1" opacity=".4"/>
  <rect x="350" y="310" width="70" height="55" fill="none" stroke="#7a5820" stroke-width="1" opacity=".4"/>
  <rect x="420" y="310" width="70" height="55" fill="none" stroke="#7a5820" stroke-width="1" opacity=".4"/>
  <rect x="490" y="310" width="70" height="55" fill="none" stroke="#7a5820" stroke-width="1" opacity=".4"/>
