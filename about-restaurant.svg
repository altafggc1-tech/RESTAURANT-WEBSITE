  <rect x="80" y="264" width="160" height="8" rx="2" fill="#5a3810"/>
  <rect x="100" y="272" width="8" height="28" rx="2" fill="#4a3010"/>
  <rect x="224" y="272" width="8" height="28" rx="2" fill="#4a3010"/>
  <!-- Table cloth 1 -->
  <rect x="72" y="240" width="176" height="30" rx="4" fill="#fff" opacity=".95" stroke="#e0d8d0" stroke-width="1"/>
