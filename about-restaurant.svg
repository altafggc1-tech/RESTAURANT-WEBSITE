  <rect x="162" y="232" width="6" height="16" rx="1" fill="#f8f0d8"/>
  <ellipse cx="165" cy="232" rx="4" ry="6" fill="#f59e0b" opacity=".8"/>
  <!-- Table 2 (right) -->
  <rect x="340" y="264" width="160" height="8" rx="2" fill="#5a3810"/>
  <rect x="355" y="272" width="8" height="28" rx="2" fill="#4a3010"/>
  <rect x="484" y="272" width="8" height="28" rx="2" fill="#4a3010"/>
  <!-- Table cloth 2 -->
  <rect x="332" y="240" width="176" height="30" rx="4" fill="#fff" opacity=".95" stroke="#e0d8d0" stroke-width="1"/>
  <!-- Table setting 2 -->
  <circle cx="390" cy="252" r="14" fill="#f5f0ea" stroke="#ddd" stroke-width="1"/>
  <circle cx="460" cy="252" r="14" fill="#f5f0ea" stroke="#ddd" stroke-width="1"/>
  <line x1="370" y1="244" x2="370" y2="262" stroke="#bbb" stroke-width="2"/>
  <line x1="380" y1="244" x2="380" y2="262" stroke="#bbb" stroke-width="1.5"/>
  <!-- Wine glass -->
  <path d="M425 226 q0 15-10 22 h20 q-10-7-10-22z" fill="#c8e8f8" opacity=".7"/>
  <line x1="425" y1="248" x2="425" y2="262" stroke="#bbb" stroke-width="1.5"/>
  <line x1="418" y1="262" x2="432" y2="262" stroke="#bbb" stroke-width="1.5"/>
