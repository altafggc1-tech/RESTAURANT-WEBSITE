  <rect x="452" y="232" width="6" height="16" rx="1" fill="#f8f0d8"/>
  <ellipse cx="455" cy="232" rx="4" ry="6" fill="#f59e0b" opacity=".8"/>
  <!-- Wall art frame -->
  <rect x="310" y="50" width="110" height="140" rx="4" fill="#3d2010" stroke="#2c1608" stroke-width="3"/>
  <rect x="318" y="58" width="94" height="124" rx="2" fill="#e8d8c0"/>
  <!-- Simple art in frame -->
  <ellipse cx="365" cy="120" rx="30" ry="40" fill="#e85d26" opacity=".6"/>
  <ellipse cx="365" cy="108" rx="20" ry="25" fill="#c8933a" opacity=".5"/>
  <!-- Overhead lights -->
  <circle cx="160" cy="20" r="6" fill="#f8e8a0"/>
  <line x1="160" y1="0" x2="160" y2="14" stroke="#888" stroke-width="2"/>
  <circle cx="160" cy="20" r="10" fill="#f9ec7a" opacity=".35"/>
  <circle cx="400" cy="20" r="6" fill="#f8e8a0"/>
  <line x1="400" y1="0" x2="400" y2="14" stroke="#888" stroke-width="2"/>
  <circle cx="400" cy="20" r="10" fill="#f9ec7a" opacity=".35"/>
  <!-- Food Haven sign -->
  <rect x="220" y="10" width="120" height="30" rx="4" fill="#1a1a2e" opacity=".85"/>
  <text x="280" y="30" text-anchor="middle" font-size="12" fill="#e85d26" font-family="Georgia, serif" font-weight="bold">🍽 Food Haven</text>
