  <circle cx="210" cy="100" r="10" fill="#c0392b"/>
  <circle cx="230" cy="112" r="11" fill="#e74c3c"/>
  <ellipse cx="192" cy="92" rx="8" ry="5" fill="#27ae60" transform="rotate(-15 192 92)"/>
  <!-- Plate -->
  <ellipse cx="150" cy="180" rx="120" ry="18" fill="#e8e0d8"/>
  <ellipse cx="150" cy="178" rx="116" ry="14" fill="#f5f0ea"/>
