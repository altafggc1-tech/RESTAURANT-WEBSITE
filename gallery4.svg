<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <defs>
    <linearGradient id="ambGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c1a0e"/>
      <stop offset="100%" stop-color="#1a0a04"/>
    </linearGradient>
  </defs>
  <rect width="600" height="240" fill="url(#ambGrad)"/>
  <!-- Mood lighting glow -->
  <ellipse cx="150" cy="60" rx="90" ry="60" fill="#f59e0b" opacity=".12"/>
  <ellipse cx="450" cy="55" rx="80" ry="55" fill="#f59e0b" opacity=".10"/>
  <!-- Table for two (left) -->
  <ellipse cx="150" cy="200" rx="90" ry="16" fill="#3d2010"/>
  <ellipse cx="150" cy="190" rx="88" ry="12" fill="#4a2814"/>
  <!-- Candle left -->
  <rect x="144" y="155" width="12" height="30" rx="2" fill="#f8f0d8"/>
  <ellipse cx="150" cy="155" rx="8" ry="12" fill="#f59e0b" opacity=".9"/>
  <ellipse cx="150" cy="148" rx="20" ry="14" fill="#f59e0b" opacity=".2"/>
  <!-- Plates left table -->
  <circle cx="115" cy="188" r="22" fill="#f5f0ea" stroke="#ddd" stroke-width="1.5"/>
  <circle cx="185" cy="188" r="22" fill="#f5f0ea" stroke="#ddd" stroke-width="1.5"/>
  <!-- Wine glasses left -->
  <path d="M110 162 q0 12-8 17 h16 q-8-5-8-17z" fill="#c8e8f8" opacity=".6"/>
  <line x1="110" y1="179" x2="110" y2="190" stroke="#bbb" stroke-width="1.5"/>
  <path d="M192 160 q0 12-8 17 h16 q-8-5-8-17z" fill="#ffe0e0" opacity=".65"/>
  <line x1="192" y1="177" x2="192" y2="190" stroke="#bbb" stroke-width="1.5"/>
  <!-- Table for two (right) -->
  <ellipse cx="450" cy="200" rx="90" ry="16" fill="#3d2010"/>
  <ellipse cx="450" cy="190" rx="88" ry="12" fill="#4a2814"/>
  <!-- Candle right -->
  <rect x="444" y="155" width="12" height="30" rx="2" fill="#f8f0d8"/>
  <ellipse cx="450" cy="155" rx="8" ry="12" fill="#f59e0b" opacity=".9"/>
  <ellipse cx="450" cy="148" rx="20" ry="14" fill="#f59e0b" opacity=".2"/>
  <!-- Plates right table -->
  <circle cx="415" cy="188" r="22" fill="#f5f0ea" stroke="#ddd" stroke-width="1.5"/>
  <circle cx="485" cy="188" r="22" fill="#f5f0ea" stroke="#ddd" stroke-width="1.5"/>
  <!-- Wine glasses right -->
  <path d="M410 162 q0 12-8 17 h16 q-8-5-8-17z" fill="#c8e8f8" opacity=".6"/>
  <line x1="410" y1="179" x2="410" y2="190" stroke="#bbb" stroke-width="1.5"/>
  <path d="M492 160 q0 12-8 17 h16 q-8-5-8-17z" fill="#ffe0e0" opacity=".65"/>
  <line x1="492" y1="177" x2="492" y2="190" stroke="#bbb" stroke-width="1.5"/>
  <!-- Pendant lights -->
  <line x1="150" y1="0" x2="150" y2="35" stroke="#888" stroke-width="2"/>
  <ellipse cx="150" cy="35" rx="20" ry="10" fill="#f8e8a0" opacity=".9"/>
  <ellipse cx="150" cy="35" rx="30" ry="18" fill="#f8e8a0" opacity=".15"/>
  <line x1="450" y1="0" x2="450" y2="32" stroke="#888" stroke-width="2"/>
  <ellipse cx="450" cy="32" rx="18" ry="9" fill="#f8e8a0" opacity=".9"/>
  <ellipse cx="450" cy="32" rx="28" ry="16" fill="#f8e8a0" opacity=".15"/>
  <!-- Centre bar -->
  <rect x="270" y="120" width="60" height="120" rx="4" fill="#2c1a0e"/>
  <rect x="258" y="118" width="84" height="8" rx="3" fill="#3d2010"/>
  <!-- Bar bottles -->
  <rect x="276" y="90" width="8" height="30" rx="3" fill="#2d5a27" opacity=".8"/>
  <rect x="288" y="85" width="8" height="35" rx="3" fill="#7b3f00" opacity=".8"/>
  <rect x="300" y="88" width="8" height="32" rx="3" fill="#4a4a8a" opacity=".8"/>
  <rect x="312" y="92" width="8" height="28" rx="3" fill="#2d5a27" opacity=".8"/>
  <!-- Label overlay -->
  <rect x="0" y="200" width="600" height="40" fill="rgba(0,0,0,.5)"/>
  <text x="300" y="225" text-anchor="middle" font-size="15" fill="#f8e8a0" font-family="Georgia, serif" font-style="italic">Evening Ambiance</text>
</svg>
