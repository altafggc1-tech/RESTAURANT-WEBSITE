<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <rect width="400" height="240" fill="#e8f0e4"/>
  <!-- Farm market background -->
  <rect x="0" y="140" width="400" height="100" fill="#8b6830"/>
  <!-- Market table -->
  <rect x="20" y="130" width="360" height="20" rx="4" fill="#a07840"/>
  <!-- Vegetable arrangement -->
  <!-- Tomatoes -->
  <circle cx="60" cy="120" r="20" fill="#e74c3c"/>
  <circle cx="57" cy="115" r="7" fill="#c0392b" opacity=".6"/>
  <circle cx="90" cy="118" r="17" fill="#e74c3c"/>
  <circle cx="75" cy="125" r="15" fill="#c0392b"/>
  <!-- Green stems -->
  <path d="M60 100 q0-8 0-16" stroke="#27ae60" stroke-width="3" fill="none"/>
  <ellipse cx="55" cy="98" rx="6" ry="3" fill="#27ae60" transform="rotate(-30 55 98)"/>
  <!-- Zucchini -->
  <rect x="140" y="100" width="70" height="28" rx="10" fill="#5a8a2e"/>
  <rect x="140" y="100" width="10" height="28" rx="8" fill="#4a7a22"/>
  <!-- Carrots -->
  <path d="M230 95 q5 20 8 38" stroke="#e67e22" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M250 93 q4 20 7 40" stroke="#f39c12" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M268 96 q4 18 6 37" stroke="#e67e22" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- Carrot tops -->
  <path d="M232 93 q-5-8-4-18" stroke="#27ae60" stroke-width="3" fill="none"/>
  <path d="M252 90 q-4-8-3-17" stroke="#2ecc71" stroke-width="3" fill="none"/>
  <!-- Herbs bundle -->
  <rect x="310" y="100" width="30" height="50" rx="4" fill="#27ae60"/>
  <ellipse cx="325" cy="100" rx="18" ry="12" fill="#2ecc71"/>
  <ellipse cx="318" cy="96" rx="10" ry="7" fill="#27ae60"/>
  <ellipse cx="332" cy="95" rx="9" ry="6" fill="#2ecc71"/>
  <!-- Twine -->
  <rect x="309" y="126" width="32" height="5" rx="2" fill="#c8933a"/>
  <!-- Market tag -->
  <rect x="155" y="148" width="90" height="28" rx="4" fill="#fff" opacity=".9"/>
  <text x="200" y="166" text-anchor="middle" font-size="11" fill="#5a3010" font-family="Georgia, serif">Farm Fresh ✓</text>
  <!-- Label -->
  <rect x="0" y="205" width="400" height="35" fill="rgba(26,46,10,.65)"/>
  <text x="200" y="228" text-anchor="middle" font-size="15" fill="#fff" font-family="Georgia, serif" font-style="italic">Our Local Suppliers</text>
</svg>
